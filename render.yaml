# Render Blueprint: New > Blueprint, point it at this repository.
services:
  - type: web
    name: examdesk
    runtime: docker
    plan: free            # free works for a demo; use "starter" or above for real hiring rounds (see README)
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true   # find it under the service's Environment tab
      - key: SEED_DEMO
        value: "true"         # set to "false" before real use, on a fresh database
      - key: RUNNER_MAX_PARALLEL
        value: "1"
    # A persistent disk keeps the H2 database across deploys and restarts. Disks need a paid plan.
    # Without one, all data resets whenever the service restarts or redeploys.
    # disk:
    #   name: examdesk-data
    #   mountPath: /app/data
    #   sizeGB: 1
