spring.application.name=examdesk
server.port=${PORT:8080}
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript,image/svg+xml

# File-based H2 (self-contained, no external DB). On Render mount a disk at /app/data to persist.
spring.datasource.url=jdbc:h2:file:${DATA_DIR:./data}/examdesk;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=5
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.h2.console.enabled=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Application
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:Admin@123}
app.seed.demo=${SEED_DEMO:true}
app.session.hours=${SESSION_HOURS:12}
app.runner.max-parallel=${RUNNER_MAX_PARALLEL:1}
app.runner.process-timeout-seconds=${RUNNER_TIMEOUT:20}
app.runner.test-timeout-ms=3000
app.runner.child-heap=${RUNNER_HEAP:64m}

logging.level.org.hibernate.orm.deprecation=error
logging.level.org.apache.pdfbox=error
